server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: qinghe-backend
  datasource:
    # SQLite 单文件数据库：dev 阶段零安装，后续通过 profile 切到 PostgreSQL
    url: jdbc:sqlite:./data/app.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 写操作是串行的，连接池开大反而更容易 SQLITE_BUSY
      maximum-pool-size: 1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect

app:
  jwt:
    # 生产环境必须用环境变量覆盖。HS256 要求密钥至少 32 字节
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
    access-ttl: 15m
    refresh-ttl: 7d
  cookie:
    # 本地是 http，生产（https）要设成 true
    secure: ${COOKIE_SECURE:false}
    same-site: Lax
  cors:
    allowed-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
